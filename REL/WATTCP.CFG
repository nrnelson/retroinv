# WATTCP.CFG - the TCP/IP settings of INVTCP.EXE.  Replace the addresses
# below with those of this PC and its network before starting INVTCP.
# INVTCP reads this file from the directory that the environment variable
# WATTCP.CFG names, else from the current directory: start it where this
# file is.
my_ip=192.168.1.50
netmask=255.255.255.0
gateway=192.168.1.1
