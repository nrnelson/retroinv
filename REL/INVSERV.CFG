; INVSERV.CFG - the settings of the RETROINV server INVSERV.EXE, which
; reads this file from the current directory when it starts.  A line
; starting with ; is a comment; a key left out takes its default.
;
; NAME=      the server's NetBIOS name; clients start INV /NET name
; DATA=      the data directory
; READONLY=  stations, separated by commas, whose users may only read,
;            whatever their level (a NetBIOS name, a mailbox file name)
; SESSIONS=  NetBIOS sessions served at once (the provider must have room
;            for them); LISTENS= how many calls are awaited at once.  The
;            server needs a NetBIOS provider; on a PC without one, give
;            SESSIONS=0 and serve only SERIAL= and MAILBOX=
; SERIAL=    serial ports served, COM1, COM2 or COM1,COM2, each on a full
;            null-modem cable; clients start INV /COM1 or /COM2
; BAUD=      their rate in bits per second; RTSCTS=1 adds RTS/CTS flow
;            control; a client's INV.CFG must give the same
; MAILBOX=   a directory holding REQUEST and RESPONSE, whose request
;            files the server answers
; IDLE=      minutes after which an idle session is closed, 0 for never
; LOG=       a file that records the server's events
; BIOS=1     draw the status screen through the BIOS; SNOW=1 on a CGA
;            that shows snow
NAME=RETROINV
DATA=DATA
LOG=INVSERV.LOG
