# DOSBox-X configuration for the headless Turbo C 2.01, Watcom C 6.5 and
# Watcom C 9.5 builds, and for the Watcom C 9.5 install.
#
# TC/runtc.sh, WC65/runwc.sh, WC95/runwc.sh and WC95/install.sh copy this
# file to a scratch directory per DOSBox-X instance and replace @REPO@
# (repository root, mounted as C:; the install's own files), @TOOLDIR@
# (the compiler install, mounted as D:), @MOUNTS@ (the further mount
# commands, one per line, deleted when there are none), @BAT@ (the batch
# file the instance runs) and @LOG@ (the file its output goes to) before
# starting DOSBox-X, so no machine-specific path is stored here.

[sdl]
output=surface
autolock=false

[log]
logfile=

[dosbox]
machine=svga_s3
memsize=16
quit warning=false

[cpu]
core=dynamic
cputype=auto
cycles=max

[dos]
ver=3.10
lfn=false

[mixer]
nosound=true

[sblaster]
sbtype=none

[gus]
gus=false

[speaker]
pcspeaker=false
tandy=off
disney=false

[midi]
mpu401=none
mididevice=none

[serial]
serial1=disabled
serial2=disabled
serial3=disabled
serial4=disabled

[parallel]
parallel1=disabled

[autoexec]
mount c "@REPO@" -nocachedir
mount d "@TOOLDIR@" -nocachedir
@MOUNTS@
c:
COMMAND /C @BAT@ > @LOG@
exit
