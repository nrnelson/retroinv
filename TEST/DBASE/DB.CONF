# DOSBox-X configuration shared by install.sh and rundb.sh, which run
# dBASE III Plus headless.  The scripts copy this file to a scratch
# directory and append the [autoexec] section with their own drive
# mounts, so no machine-specific path is stored here.

[sdl]
output=surface
autolock=false

[log]
logfile=

[dosbox]
machine=svga_s3
memsize=16
quit warning=false

[cpu]
core=dynamic
cputype=auto
cycles=max

[dos]
ver=3.10
lfn=false

[mixer]
nosound=true

[sblaster]
sbtype=none

[gus]
gus=false

[speaker]
pcspeaker=false
tandy=off
disney=false

[midi]
mpu401=none
mididevice=none

[serial]
serial1=disabled
serial2=disabled
serial3=disabled
serial4=disabled

[parallel]
parallel1=disabled
