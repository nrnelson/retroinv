[network.setup]
version=0x3110
netcard=ms$ne2clone,1,MS$NE2CLONE,1
transport=tcpip-32r,TCPIP-32R
lana0=ms$ne2clone,1,tcpip-32r

[protman]
DriverName=PROTMAN$

[MS$NE2CLONE]
DriverName=MS2000$
INTERRUPT=5
IOBASE=0x300

[NE2000]
Adapters=MS$NE2CLONE

[TCPIP-32R]
DriverName=TCPIP$
BINDINGS=MS$NE2CLONE
LANABASE=0
