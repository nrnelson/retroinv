[boot]
shell=progman.exe
display.drv=vga.drv
system.drv=system.drv
comm.drv=comm.drv
network.drv=
oemfonts.fon=vgaoem.fon
fonts.fon=vgasys.fon
fixedfon.fon=vgafix.fon
386grabber=vga.3gr
mouse.drv=nomouse.drv
keyboard.drv=keyboard.drv
sound.drv=mmsound.drv
language.dll=
drivers=mmsystem.dll

[keyboard]
type=4
subtype=0
keyboard.dll=
oemansi.bin=

[boot.description]
system.drv=MS-DOS System
display.drv=VGA
keyboard.typ=Enhanced 101 or 102 key US and Non US keyboards
mouse.drv=No mouse or other pointing device
network.drv=No Network Installed
language.dll=English (American)
codepage=437
woafont.fon=English (437)
aspect=100,96,96

[386Enh]
display=*vddvga
ebios=*ebios
keyboard=*vkd
mouse=*vmd
woafont=dosapp.fon
network=*dosnet,*vnetbios
netheapsize=16
; TCP/IP-32 on the NDIS 3 driver of the NE2000.
netcard=ne2000.386
transport=vip.386,vtdi.386,vtcp.386,vdhcp.386,vnbt.386
netmisc=ndis.386
device=*vcd
device=*vpicd
device=*vtd
device=*reboot
device=*vdmad
device=*vsd
device=*v86mmgr
device=*pageswap
device=*dosmgr
device=*vmpoll
device=*wshell
device=*PAGEFILE
device=*BLOCKDEV
device=*vfd
device=*parity
device=*biosxlat
device=*vmcpd
device=*combuff
device=*cdpscsi
device=vtdapi.386
device=vpmtd.386
device=vcomm.386
device=serial.386
device=lpt.386
device=ifsmgr.386
device=vcache.386
device=vshare.386
device=wsock.386
device=wstcp.386
local=CON
FileSysChange=off
COM3Irq=4
COM3Base=03E8
COM4Irq=3
COM4Base=02E8
; No demand paging, so no swap file.
Paging=no
; Under QEMU's PC machine WIN386 quits at start-up for some DOS memory
; layouts unless E000h-EFFFh is excluded.
EMMExclude=E000-EFFF
CGA40WOA.FON=CGA40WOA.FON
CGA80WOA.FON=CGA80WOA.FON
EGA40WOA.FON=EGA40WOA.FON
EGA80WOA.FON=EGA80WOA.FON

[NonWindowsApp]
localtsrs=dosedit,ced

[vcache]
minfilecache=512

[mci]
WaveAudio=mciwave.drv
Sequencer=mciseq.drv
CDAudio=mcicda.drv

[drivers]
timer=timer.drv
midimapper=midimap.drv

[DDEShares]
CHAT$=winchat,chat,,31,,0,,0,0,0
SCHAT$=winchat,chat,,31,,0,,0,0,0
CLPBK$=clipsrv,system,,31,,0,,0,0,0
HEARTS$=mshearts,hearts,,15,,0,,0,0,0

; No Microsoft Windows Network: its driver needs the security settings
; WFWSYS.CFG, which only SETUP's half in Windows makes.  The computer
; name is NetBIOS over TCP/IP's.
[network]
winnet=nonet
multinet=nonet
ComputerName=RIWFW
Workgroup=WORKGROUP

; TCP/IP-32 on the NE2000 (the PROTOCOL.INI section MS$NE2CLONE), no
; DHCP: a fixed address in 10.0.2.0/24, beside the bridge's 10.0.2.15
; (TEST/INTEG/WATTCP.CFG) on a segment the two share, and the gateway of
; QEMU's user-mode network, the host.
[MSTCP]
EnableRouting=0
Interfaces=MS$NE2CLONE
deadgwdetect=1
pmtudiscovery=1

[MS$NE2CLONE]
Binding=MS$NE2CLONE
Description=NE2000 Compatible
IPAddress=10.0.2.16
IPMask=255.255.255.0
DefaultGateway=10.0.2.2
DHCPEnabled=0

[NBT]
LANABASE=0
EnableProxy=0
EnableDNS=0

[DNS]
HostName=riwfw
DomainName=
DNSServers=
DNSDomains=
