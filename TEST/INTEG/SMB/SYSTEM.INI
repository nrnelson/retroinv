[network]
filesharing=no
printsharing=no
autologon=no
computername=@COMPUTERNAME@
lanroot=C:\NET
username=@COMPUTERNAME@
workgroup=RETROINV
reconnect=no
directory=C:\NET
dospophotkey=N
lmlogon=0
logondomain=RETROINV
preferredredir=basic
autostart=basic
maxconnections=8

[network drivers]
netcard=am2100.dos
transport=tcpdrv.dos,nemm.dos
devdir=C:\NET
LoadRMDrivers=yes

[Password Lists]
*Shares=C:\NET\SHARES.PWL
