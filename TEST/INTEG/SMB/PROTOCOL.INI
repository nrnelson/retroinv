[network.setup]
version=0x3110
netcard=ms$am2100,1,MS$AM2100,1
transport=tcpip,TCPIP
lana0=ms$am2100,1,tcpip

[protman]
DriverName=PROTMAN$

[MS$AM2100]
DriverName=AM2100$
IOADDRESS=0xC000
INTERRUPT=10

[TCPIP]
DriverName=TCPIP$
BINDINGS=MS$AM2100
LANABASE=0
DisableDHCP=1
IPAddress0=10 0 2 15
SubNetMask0=255 255 255 0
DefaultGateway0=10 0 2 2
