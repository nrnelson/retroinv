# WATTCP settings for the QEMU user-mode network (slirp): fixed guest
# address, slirp's gateway and DNS.  WATTCP looks for WATTCP.CFG in the
# directory named by the WATTCP.CFG environment variable if that is set,
# otherwise in the directory of the running program (argv[0]); if the file
# is not there, it tries the current directory.
my_ip=10.0.2.15
netmask=255.255.255.0
gateway=10.0.2.2
nameserver=10.0.2.3
hostname=RETROVM
