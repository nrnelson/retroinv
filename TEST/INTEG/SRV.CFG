; INVSERV.CFG of the servers of srvgate.sh, tcpgate.sh and wgagate.sh,
; run from D:\ of VM A: the data, the event log and the mailbox MBOX on
; D:, RIREAD (a station of NET2.SCR and MBOX.SCR) read-only, every NetBIOS
; session the server can serve and COM1.
NAME=RISRV
DATA=DATA
READONLY=RIREAD
LOG=SRV.LOG
SESSIONS=6
SERIAL=COM1
MAILBOX=MBOX
