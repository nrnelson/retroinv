[network.setup]
version=0x3110
netcard=ms$am2100,1,MS$AM2100,1
transport=ms$netbeui,MS$NETBEUI
transport=ms$ndishlp,MS$NDISHLP
lana0=ms$am2100,1,ms$netbeui
lana1=ms$am2100,1,ms$ndishlp

[protman]
DriverName=PROTMAN$
PRIORITY=MS$NDISHLP

[MS$AM2100]
DriverName=AM2100$
IOADDRESS=0xC000
INTERRUPT=10

[MS$NETBEUI]
DriverName=netbeui$
SESSIONS=16
NCBS=32
BINDINGS=MS$AM2100
LANABASE=0
T1=@T1@

[MS$NDISHLP]
DriverName=ndishlp$
BINDINGS=MS$AM2100
